<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<title>Canvas Shooter Ultimate</title>
<style>
body{margin:0;overflow:hidden;background:#000;color:white;font-family:sans-serif}
canvas{display:block}
#menu{
  position:fixed;inset:0;
  background:rgba(0,0,0,.85);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  gap:14px
}
button,select{padding:10px 20px;font-size:16px}
</style>
</head>
<body>

<div id="menu">
  <h1>Canvas Shooter</h1>
  <label>武器：
    <select id="weaponSel">
      <option value="pistol">手槍</option>
      <option value="rifle">步槍（長按）</option>
      <option value="sniper">狙擊</option>
    </select>
  </label>
  <label>難度：
    <select id="difficultySel">
      <option value="easy">簡單</option>
      <option value="normal">普通</option>
      <option value="hard">困難</option>
    </select>
  </label>
  <button onclick="startGame()">開始遊戲</button>
</div>

<canvas id="game"></canvas>

<script>
/* ===== Canvas ===== */
const canvas=document.getElementById("game");
const ctx=canvas.getContext("2d");
resize();onresize=resize;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}

/* ===== 狀態 ===== */
let gameStarted=false,gameOver=false;
let mouseDown=false;

/* ===== 玩家 ===== */
const player={
  x:0,y:0,r:12,
  speed:4,baseSpeed:4,
  hp:100,maxHp:100
};

/* ===== 武器（含彈匣）===== */
const weaponPresets={
  pistol:{dmg:1,cooldown:300,auto:false,speed:8,mag:12,reload:120},
  rifle:{dmg:0.6,cooldown:120,auto:true,speed:9,mag:30,reload:150},
  sniper:{dmg:3,cooldown:700,auto:false,speed:12,mag:5,reload:180}
};

const weapon={
  dmg:1,cooldown:300,auto:false,bulletSpeed:8,
  magSize:0,ammo:0,
  reloadTime:0,reloading:false
};

/* ===== 難度 ===== */
let difficulty={enemyHp:1,enemySpeed:1,spawnRate:1000};

/* ===== 輸入 ===== */
const keys={};
onkeydown=e=>{
  keys[e.key]=true;
  if(e.key==="r" && !weapon.reloading) startReload();
};
onkeyup=e=>keys[e.key]=false;
onmousedown=()=>mouseDown=true;
onmouseup=()=>mouseDown=false;

let mouseX=0,mouseY=0;
canvas.onmousemove=e=>{mouseX=e.clientX;mouseY=e.clientY};

/* ===== 子彈 ===== */
const bullets=[];
let lastShot=0;

function shoot(){
  if(weapon.reloading || weapon.ammo<=0) return;

  const now=Date.now();
  if(now-lastShot<weapon.cooldown)return;
  lastShot=now;
  weapon.ammo--;

  const a=Math.atan2(mouseY-player.y,mouseX-player.x);
  bullets.push({
    x:player.x,y:player.y,
    vx:Math.cos(a)*weapon.bulletSpeed,
    vy:Math.sin(a)*weapon.bulletSpeed,
    life:80
  });
}

/* ===== 換彈 ===== */
function startReload(){
  if(weapon.ammo===weapon.magSize) return;
  weapon.reloading=true;
  weapon.reloadTime=weapon.reloadMax;
}

function updateReload(){
  if(!weapon.reloading) return;
  weapon.reloadTime--;
  if(weapon.reloadTime<=0){
    weapon.reloading=false;
    weapon.ammo=weapon.magSize;
  }
}

/* ===== 敵人 ===== */
const enemies=[];
function spawnEnemy(){
  enemies.push({
    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height,
    hp:20*difficulty.enemyHp,
    maxHp:20*difficulty.enemyHp,
    speed:1.2*difficulty.enemySpeed
  });
}

/* ===== 開始 ===== */
function startGame(){
  menu.style.display="none";
  gameStarted=true;
  player.x=canvas.width/2;
  player.y=canvas.height/2;

  const w=weaponPresets[weaponSel.value];
  Object.assign(weapon,{
    dmg:w.dmg,
    cooldown:w.cooldown,
    auto:w.auto,
    bulletSpeed:w.speed,
    magSize:w.mag,
    ammo:w.mag,
    reloadMax:w.reload
  });

  difficulty =
    difficultySel.value==="easy"?{enemyHp:0.7,enemySpeed:0.8,spawnRate:1400}:
    difficultySel.value==="hard"?{enemyHp:1.5,enemySpeed:1.3,spawnRate:700}:
    {enemyHp:1,enemySpeed:1,spawnRate:1000};

  setInterval(spawnEnemy,difficulty.spawnRate);
}

/* ===== 畫槍 ===== */
function drawGun(){
  const a=Math.atan2(mouseY-player.y,mouseX-player.x);
  ctx.save();
  ctx.translate(player.x,player.y);
  ctx.rotate(a);
  ctx.fillStyle="#aaa";
  ctx.fillRect(10,-3,18,6);
  ctx.restore();
}

/* ===== 主迴圈 ===== */
function loop(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  if(!gameStarted)return requestAnimationFrame(loop);

  let mx=0,my=0;
  if(keys.w)my--;if(keys.s)my++;
  if(keys.a)mx--;if(keys.d)mx++;
  player.x+=mx*player.speed;
  player.y+=my*player.speed;

  if(weapon.auto && mouseDown) shoot();

  updateReload();

  bullets.forEach((b,i)=>{
    b.x+=b.vx;b.y+=b.vy;b.life--;
    ctx.fillStyle="yellow";
    ctx.fillRect(b.x-2,b.y-2,4,4);
    if(b.life<=0)bullets.splice(i,1);
  });

  enemies.forEach((e,ei)=>{
    const dx=player.x-e.x,dy=player.y-e.y;
    const d=Math.hypot(dx,dy)||1;
    e.x+=dx/d*e.speed;
    e.y+=dy/d*e.speed;

    bullets.forEach((b,bi)=>{
      if(Math.hypot(b.x-e.x,b.y-e.y)<16){
        e.hp-=weapon.dmg;
        bullets.splice(bi,1);
      }
    });

    if(e.hp<=0)enemies.splice(ei,1);

    ctx.fillStyle="red";
    ctx.beginPath();ctx.arc(e.x,e.y,16,0,Math.PI*2);ctx.fill();

    ctx.fillStyle="#400";
    ctx.fillRect(e.x-16,e.y-26,32,4);
    ctx.fillStyle="#f33";
    ctx.fillRect(e.x-16,e.y-26,32*(e.hp/e.maxHp),4);
  });

  ctx.fillStyle="white";
  ctx.beginPath();ctx.arc(player.x,player.y,12,0,Math.PI*2);ctx.fill();
  drawGun();

  /* UI */
  ctx.fillStyle="white";
  ctx.fillText(
    weapon.reloading ? "換彈中..." : `彈藥 ${weapon.ammo}/${weapon.magSize}`,
    20,20
  );

  requestAnimationFrame(loop);
}

canvas.onclick=()=>!weapon.auto&&shoot();
loop();
</script>
</body>
</html>
